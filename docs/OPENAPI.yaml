openapi: 3.1.0
info:
  title: Awaaz Multi-User SaaS API
  version: 1.0.0
  description: >
    REST API for Awaaz (Idea 1: Multilingual Mock Relief-Assistance Module) built on a
    tenant-isolated multi-user SaaS foundation. All demonstration identities, policies,
    and payments are synthetic. Not an official government service.
servers:
  - url: http://localhost:4000/api/v1
    description: Local backend server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    OrgHeader:
      name: X-Organization-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Active tenant workspace UUID (verified server-side against user memberships)
paths:
  /health:
    get:
      summary: Service health, integration readiness, and registered modules
      responses:
        '200':
          description: Service status
  /auth/login:
    post:
      summary: Authenticate user and issue session cookie + bearer token
      responses:
        '200':
          description: Authenticated session
        '401':
          description: Invalid credentials
  /auth/register:
    post:
      summary: Register a new user (and optionally create a new workspace)
      responses:
        '201':
          description: User created
  /auth/logout:
    post:
      summary: Clear session cookie
      responses:
        '200':
          description: Logged out
  /auth/me:
    get:
      summary: Return current user profile, active workspace, role, memberships, and modules
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Session details
  /workspaces:
    get:
      summary: List workspaces the authenticated user belongs to
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Workspace list
    post:
      summary: Create a new tenant workspace
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Workspace created
  /cases:
    post:
      summary: Create a mock relief-assistance case (idempotent via idempotency_key)
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Case created
        '200':
          description: Idempotent replay of existing case
    get:
      summary: List authorized cases within active tenant workspace
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Case list
  /cases/{id}:
    get:
      summary: Retrieve case detail, answers, documents, reviews (internal notes redacted for citizens/helpers), and mock payments
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Case detail
        '403':
          description: Forbidden
        '404':
          description: Not found in active workspace
  /cases/{id}/answers:
    patch:
      summary: Save or confirm structured case answers with optimistic sync conflict check
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Answers updated
        '409':
          description: Offline sync conflict
  /cases/{id}/extract-field:
    post:
      summary: Extract a single backend-selected field from a transcript via Gemini AI adapter
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Validated extraction output
        '503':
          description: AI provider unconfigured
  /cases/{id}/submit:
    post:
      summary: Submit case with active processing consent and run deterministic eligibility analysis
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Submitted case and deterministic analysis
  /cases/{id}/analyze:
    post:
      summary: Run deterministic eligibility rules engine and evidence completeness scorer
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Deterministic analysis result
  /cases/{id}/analysis:
    get:
      summary: Fetch latest deterministic eligibility analysis for a case
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Latest analysis
  /voice/languages:
    get:
      summary: Return provider-independent language registry with verified STT/TTS flags
      responses:
        '200':
          description: Language capabilities
  /voice/transcribe:
    post:
      summary: Transcribe short push-to-talk audio via configured VoiceProvider adapter
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Transcript
        '503':
          description: Voice provider unconfigured
  /voice/speak:
    post:
      summary: Synthesize short text prompt via configured VoiceProvider adapter
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Audio stream
        '503':
          description: Voice provider unconfigured
  /documents:
    post:
      summary: Upload synthetic supporting document to tenant-scoped private storage
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Document stored privately
  /documents/{id}/extract:
    post:
      summary: Run document extraction and cross-field conflict detection
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Updated document record
  /documents/{id}:
    get:
      summary: Issue short-lived signed URL for authorized private document access
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Document metadata and signed URL
  /rag/query:
    post:
      summary: Query tenant synthetic policy knowledge base with citations
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Grounded answer or honest lexical excerpt fallback
  /officer/cases:
    get:
      summary: List department/workspace review queue (Officer role only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Officer case queue
  /cases/{id}/decision:
    post:
      summary: Record human officer approval or rejection
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Decision recorded
  /cases/{id}/request-information:
    post:
      summary: Officer requests additional information from applicant
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Information requested
  /admin/rules:
    get:
      summary: List eligibility rules and active versions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Rules list
    post:
      summary: Create and publish a new immutable eligibility rule version (Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Rule version created
  /admin/rules/{id}/publish:
    post:
      summary: Switch active rule version (Admin only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active version updated
  /admin/rules/{id}/versions:
    get:
      summary: List historical rule versions and evaluated case counts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Version history
  /consent:
    post:
      summary: Grant processing or helper-delegation consent (Citizen only)
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Consent recorded
    get:
      summary: List authorized consent records
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Consent history
  /consent/{id}/withdraw:
    post:
      summary: Withdraw consent and immediately revoke helper access server-side
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Consent withdrawn
  /audit:
    get:
      summary: Read-only audit logs, AI traces, and rule publication history (Auditor/Admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Audit history
  /mock-payments:
    post:
      summary: Simulate synthetic mock disbursement for an APPROVED case (Officer only)
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Mock payment simulated
  /mock-payments/{id}:
    get:
      summary: Fetch mock payment record
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Mock payment details
